    <style>
      .search-results-page {
        padding-top: calc(var(--nav-h) + 40px);
        min-height: 100vh;
        padding-bottom: 80px;
      }
      .search-results-header {
        max-width: 1100px;
        margin: 0 auto 32px;
        padding: 0 24px;
      }
      .search-results-title {
        font-family: var(--font-d);
        font-size: 28px;
        color: var(--cream);
        margin-bottom: 6px;
      }
      .search-results-meta {
        font-family: var(--font-b);
        font-size: 13px;
        color: var(--muted);
      }
      .search-results-meta span {
        color: var(--gold);
      }
      .results-grid {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 24px;
      }
      .result-card {
        background: var(--ink-card);
        border: 1px solid var(--border-s);
        border-radius: var(--r-lg);
        overflow: hidden;
        transition:
          transform 0.2s,
          border-color 0.2s;
        display: flex;
        flex-direction: column;
        cursor: pointer;
        text-decoration: none;
        color: inherit;
      }
      .result-card:hover {
        transform: translateY(-4px);
        border-color: var(--border);
      }
      .result-card-cover {
        position: relative;
        aspect-ratio: 0.707;
        background: #1a1a2e;
        overflow: hidden;
      }
      .result-card-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .result-card-cover .no-cover {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        background: linear-gradient(135deg, var(--ink-mid), #1a1a2e);
      }
      .result-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 3px;
        font-family: var(--font-b);
        letter-spacing: 0.08em;
      }
      .result-card-body {
        padding: 14px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .result-genre {
        font-family: var(--font-b);
        font-size: 10px;
        color: var(--gold);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .result-title {
        font-family: var(--font-d);
        font-size: 15px;
        color: var(--cream);
        line-height: 1.3;
      }
      .result-highlight {
        font-family: var(--font-b);
        font-size: 11px;
        color: var(--muted);
        line-height: 1.4;
      }
      .result-highlight mark {
        background: var(--gold-dim);
        color: var(--gold);
        border-radius: 2px;
        padding: 0 2px;
      }
      .result-price {
        font-family: var(--font-b);
        font-size: 13px;
        color: var(--rose);
        font-weight: 600;
        margin-top: auto;
      }
      .result-badge-digital {
        background: rgba(122, 167, 201, 0.18);
        color: #7aa7c9;
      }
      .result-badge-paperback {
        background: rgba(212, 175, 55, 0.18);
        color: var(--gold);
      }
      .no-results {
        max-width: 500px;
        margin: 60px auto;
        text-align: center;
        padding: 0 24px;
      }
      .no-results-icon {
        font-size: 64px;
        margin-bottom: 20px;
      }
      .no-results h3 {
        font-family: var(--font-d);
        font-size: 24px;
        color: var(--cream);
        margin-bottom: 10px;
      }
      .no-results p {
        font-family: var(--font-b);
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 24px;
      }
      .search-filters {
        max-width: 1100px;
        margin: 0 auto 24px;
        padding: 0 24px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .filter-chip {
        background: var(--ink-card);
        border: 1px solid var(--border-s);
        color: var(--muted);
        font-size: 12px;
        padding: 5px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-family: var(--font-b);
        transition: all 0.2s;
      }
      .filter-chip:hover,
      .filter-chip.active {
        border-color: var(--gold);
        color: var(--gold);
        background: var(--gold-dim);
      }
      .result-card.type-digital {
        border: 1.5px solid rgba(122, 167, 201, 0.55);
        background: #10202e;

      .result-card.type-digital:hover {
        border-color: #7aa7c9;
        background: #142838;
      }
      .result-card.type-print {
        border: 1.5px solid rgba(212, 175, 55, 0.55);

      .result-card.type-print:hover {
        border-color: var(--gold);
        background: #2c220d;

    <script>
      renderAuthForm("in");
      chLoadBookStats().catch(function () {});

      var chS = window.CHSearch; // shared matching engine from search-system.js

      /* ---------------------------------------------------------
         1. Read what the user searched for
         --------------------------------------------------------- */
      function readSearchState() {
        var storedGenre = null,
          storedQuery = null,
          incoming = "";
        try {
          storedGenre = sessionStorage.getItem("ch_last_search_genre");
          storedQuery = sessionStorage.getItem("ch_last_search_query");
          // clean-urls.js can strip ?q= / ?genre= from the address bar, so the
          // <head> script saves them here. Use them as a fallback.
          incoming = sessionStorage.getItem("ch_incoming_qs") || "";
          sessionStorage.removeItem("ch_last_search_query");
          sessionStorage.removeItem("ch_last_search_genre");
          sessionStorage.removeItem("ch_incoming_qs");
        } catch (e) {}

        var params = new URLSearchParams(window.location.search);
        var hashParams = new URLSearchParams(
          (window.location.hash || "").replace(/^#/, ""),
        );
        var inc = new URLSearchParams(incoming);

        var q =
          storedQuery ||
          params.get("q") ||
          hashParams.get("q") ||
          inc.get("q") ||
          "";
        var genre =
          storedGenre ||
          params.get("genre") ||
          hashParams.get("genre") ||
          inc.get("genre") ||
          "";

        // query and filter now work TOGETHER (e.g. "chigaya" + Print)
        return { query: q.trim(), filter: genre || "all" };
      }

      var state = readSearchState();
      var currentQuery = state.query;
      var currentFilter = state.filter;

      /* ---------------------------------------------------------
         2. Print-edition data
         --------------------------------------------------------- */
      // Maps each CH_TITLE_MEDIA key + volume to its real print page URL
      var CH_PRINT_PAGE_URLS = {
        chigaya: { 1: "print-chigaya-vol1.html", 2: "print-chigaya-vol2.html" },
        grenimal: {
          1: "print-executioner-vol1.html",
          2: "print-executioner-vol2.html",
        },
        connie: {
          1: "print-allrounder-vol1.html",
          2: "print-allrounder-vol2.html",
        },
        matchmaker: { 1: "print-matchmaker.html" },
        zombie: {
          1: "print-abandoned-vol1.html",
          2: "print-abandoned-vol2.html",
        },
        raeliana: {
          1: "print-raeliana-vol1.html",
          2: "print-raeliana-vol2.html",
        },
        baroness: {
          1: "print-baroness.html",
          2: "print-baroness.html",
          3: "print-baroness.html",
        },
        fktl: {
          1: "print-from.html",
          2: "print-from.html",
          3: "print-from.html",
        },
        archduke: { 1: "print-archduke.html", 2: "print-archduke.html" },
        darling: { 1: "print-darling.html", 2: "print-darling.html" },
        gaze: { 1: "gaze.html" },
        thebird: { 1: "thebird.html" },
        theking: { 1: "theking.html" },
        until: { 1: "until.html" },
        lovebeyond: { 1: "loveBeyond.html" },
        mobs: { 1: "twoOfUs.html" },
        emma: { 1: "emma.html" },
        inksoaked: { 1: "inkSoaked.html" },
        devilinme: { 1: "devilInMe.html" },
        fairytrap: { 1: "fairyTrap.html" },
        addictedtoyou: { 1: "addictedToYou.html" },
        villainsdad: { 1: "flirting.html" },
        rosemanor: { 1: "rosemanor.html" },
        kissbeforegunshot: { 1: "kissbefore.html" },
        doomsdayrequiem: { 1: "doomsday.html" },
        chiaroscuro: { 1: "chiaroscuro.html" },
        soulguiders: { 1: "soulguiders.html" },
        reverse4you: { 1: "print-reverse4you.html" },
        plslove: { 1: "print-plslove.html" },
        earthvows: { 1: "print-earthvows.html" },
        cranium: { 1: "print-cranium.html" },
        enemieswithbenefits: { 1: "print-enemies.html" },
      };

      // No live print product for these yet — excluded from print search results
      var CH_PRINT_NOT_AVAILABLE = [
        "octopiece",
        "seameetsshore",
        "borrowing",
        "afternoon",
        "timecloset",
      ];

      function chBuildEditionSubLabel(vol, edKey, edLabel, content) {
        if (String(edKey).toLowerCase() === "standard") {
          return vol.label;
        }
        return (
          vol.label +
          ": " +
          edLabel +
          " Edition" +
          (content ? " with " + content : "")
        );
      }

      function chGetEditionContentSafe(titleKey, volume, edKey) {
        if (typeof chGetEditionContent === "function") {
          try {
            var val = chGetEditionContent(titleKey, volume, edKey);
            if (val) return val;
          } catch (e) {}
        }
        var map =
          (typeof CH_EDITION_CONTENTS !== "undefined" && CH_EDITION_CONTENTS) ||
          {};
        var entry = map[titleKey];
        if (!entry) return "";
        if (entry[edKey]) return entry[edKey];
        if (entry[volume] && entry[volume][edKey]) return entry[volume][edKey];
        return "";
      }

      // One search entry per print edition, built from CH_TITLE_MEDIA
      function chBuildPrintSearchEntries() {
        var entries = [];
        var media =
          (typeof CH_TITLE_MEDIA !== "undefined" && CH_TITLE_MEDIA) ||
          window.CH_TITLE_MEDIA ||
          {};

        Object.keys(media).forEach(function (titleKey) {
          try {
            if (CH_PRINT_NOT_AVAILABLE.indexOf(titleKey) !== -1) return;
            var data = media[titleKey];
            var urlMap = CH_PRINT_PAGE_URLS[titleKey];
            if (!data || !urlMap) return;

            // Safe even if CH_PRINT_GENRE_MAP isn't defined (it used to throw
            // and silently drop EVERY print result)
            var digital = chS.findDigital(data.name, null);
            var genre =
              (typeof CH_PRINT_GENRE_MAP !== "undefined" &&
                CH_PRINT_GENRE_MAP &&
                CH_PRINT_GENRE_MAP[titleKey]) ||
              (digital && digital.genre) ||
              "Fiction";
            // which imprint this print edition belongs to (Manga, Novel, ...)
            var baseCategory =
              chS.categoryForTitleKey(titleKey) ||
              (digital && digital.category) ||
              null;

            Object.keys(data.volumes || {}).forEach(function (volNum) {
              try {
                var pageUrl = urlMap[volNum];
                if (!pageUrl) return;
                var vol = data.volumes[volNum];

                Object.keys(vol.editions || {}).forEach(function (edKey) {
                  try {
                    var ed = vol.editions[edKey];
                    var edLabel =
                      ed.label ||
                      edKey.charAt(0).toUpperCase() + edKey.slice(1);
                    var content = chGetEditionContentSafe(
                      titleKey,
                      Number(volNum),
                      edKey,
                    );

                    entries.push(
                      chS.annotate({
                        title: data.name,
                        sub: chBuildEditionSubLabel(
                          vol,
                          edKey,
                          edLabel,
                          content,
                        ),
                        genre: genre,
                        category: "Print",
                        baseCategory: baseCategory,
                        synopsis: vol.synopsis || "",
                        keywords: genre + " " + data.name + " " + titleKey,
                        cover: ed.images && ed.images[0],
                        price: ed.price,
                        url: pageUrl,
                      }),
                    );
                  } catch (edErr) {
                    console.warn(
                      "Print entry failed:",
                      titleKey,
                      volNum,
                      edKey,
                    );
                  }
                });
              } catch (volErr) {
                console.warn("Print volume failed:", titleKey, volNum);
              }
            });
          } catch (titleErr) {
            console.warn("Print title failed:", titleKey, titleErr);
          }
        });

        return entries;
      }

      /* ---------------------------------------------------------
         3. Everything that can be searched (digital + print)
         --------------------------------------------------------- */
      function chGetAllItems() {
        var builtPrint = chBuildPrintSearchEntries();
        var printUrls = {};
        builtPrint.forEach(function (e) {
          printUrls[e.url] = true;
        });

        var items = [];
        (window.CH_CATALOG || []).forEach(function (item) {
          // Print items in catalog.js are kept too (previously they were all
          // thrown away, so print titles missing from CH_TITLE_MEDIA never
          // showed up). Skip only the ones already covered edition-by-edition.
          if (chS.isPrintItem(item) && printUrls[item.url]) return;
          items.push(item);
        });
        return items.concat(builtPrint);
      }

      /* ---------------------------------------------------------
         4. Render
         --------------------------------------------------------- */
      function renderResults(query, filter) {
        var grid = document.getElementById("resultsGrid");
        var meta = document.getElementById("resultsMeta");
        var q = (query || "").trim();
        var hasFilter = !!filter && filter !== "all";

        if (!q && !hasFilter) {
          if (meta) meta.style.display = "none";
          grid.innerHTML =
            '<div class="no-results" style="grid-column:1/-1">' +
            '<div class="no-results-icon"><i class="ti ti-search" aria-hidden="true"></i></div>' +
            "<h3>Start exploring</h3>" +
            "<p>Use the search bar in the nav above or pick a genre to see titles here.</p>" +
            '<a href="index.html#allSeries" class="btn-gold">Browse All Titles</a>' +
            "</div>";
          return;
        }

        var filtered = chS.search(chGetAllItems(), q, filter);

        if (meta) meta.style.display = "";
        document.getElementById("resultCount").textContent = filtered.length;
        document.getElementById("resultNoun").textContent =
          filtered.length === 1 ? "result" : "results";
        document.getElementById("queryDisplay").textContent = q
          ? hasFilter
            ? q + " \u00b7 " + filter
            : q
          : filter;

        if (!filtered.length) {
          grid.innerHTML =
            '<div class="no-results" style="grid-column:1/-1">' +
            '<div class="no-results-icon">📚</div>' +
            "<h3>No results found</h3>" +
            "<p>Try different keywords or browse by category.</p>" +
            '<a href="index.html#allSeries" class="btn-gold">Browse All Titles</a>' +
            "</div>";
          return;
        }

        var esc = chS.escapeHtml;
        grid.innerHTML = filtered
          .map(function (item) {
            var isPaperback = !!item._isPrint;
            var badgeLabel = isPaperback ? "Paperback" : "Digital";
            var badgeClass = isPaperback
              ? "result-badge result-badge-paperback"
              : "result-badge result-badge-digital";
            var typeClass = isPaperback ? "type-print" : "type-digital";
            var subLine = item.sub
              ? '<div class="result-highlight" style="color:var(--gold);font-weight:600;">' +
                esc(item.sub) +
                "</div>"
              : "";
            var cleanPrice = q
              ? (item.price || "").replace(/^From\s*/i, "")
              : item.price || "";
            var priceLine = cleanPrice
              ? '<div class="result-price">' + esc(cleanPrice) + "</div>"
              : "";
            return (
              '<a href="' +
              esc(item.url || "#") +
              '" class="result-card ' +
              typeClass +
              '">' +
              '<div class="result-card-cover">' +
              (item.cover
                ? '<img src="' +
                  esc(item.cover) +
                  '" alt="' +
                  esc(item.title) +
                  '" />'
                : '<div class="no-cover">📖</div>') +
              '<span class="' +
              badgeClass +
              '">' +
              badgeLabel +
              "</span>" +
              "</div>" +
              '<div class="result-card-body">' +
              '<div class="result-genre">' +
              esc(item.genre) +
              "</div>" +
              '<div class="result-title">' +
              esc(item.title) +
              "</div>" +
              subLine +
              priceLine +
              "</div></a>"
            );
          })
          .join("");
      }

      /* ---------------------------------------------------------
         5. Filter chips + URL
         --------------------------------------------------------- */
      function setActiveChip(filter) {
        var box = document.getElementById("searchFilters");
        var want = chS.normalize(filter);
        var found = false;
        // drop a temporary chip added earlier for a genre that has no chip
        box.querySelectorAll(".filter-chip[data-temp]").forEach(function (c) {
          c.parentNode.removeChild(c);
        });
        box.querySelectorAll(".filter-chip").forEach(function (c) {
          var isMatch = chS.normalize(c.getAttribute("data-filter")) === want;
          c.classList.toggle("active", isMatch);
          if (isMatch) found = true;
        });
        // arrived from a genre tile (e.g. "Slice of Life") with no chip -> add one
        if (!found && filter && filter !== "all") {
          var chip = document.createElement("button");
          chip.className = "filter-chip active";
          chip.setAttribute("data-filter", filter);
          chip.setAttribute("data-temp", "1");
          chip.textContent = filter;
          box.appendChild(chip);
        }
      }

      function syncUrl() {
        try {
          var url = new URL(window.location.href);
          if (currentQuery) url.searchParams.set("q", currentQuery);
          else url.searchParams.delete("q");
          if (currentFilter && currentFilter !== "all")
            url.searchParams.set("genre", currentFilter);
          else url.searchParams.delete("genre");
          window.history.replaceState({}, "", url);
        } catch (e) {}
      }

      function filterResults(filter) {
        currentFilter = filter || "all";
        // keep the typed query: "chigaya" + Print now narrows, not resets
        setActiveChip(currentFilter);
        syncUrl();
        renderResults(currentQuery, currentFilter);
      }

      document
        .getElementById("searchFilters")
        .addEventListener("click", function (e) {
          var chip = e.target.closest(".filter-chip");
          if (!chip) return;
          filterResults(chip.getAttribute("data-filter"));
        });

      setActiveChip(currentFilter);
      syncUrl(); // keeps the search in the address bar so a refresh works
      renderResults(currentQuery, currentFilter);

      (function () {
        if (localStorage.getItem("ch-theme") === "light") {
          document.body.classList.add("light-mode");
        }
      })();

      function toggleTheme() {
        const isLight = document.body.classList.toggle("light-mode");
        localStorage.setItem("ch-theme", isLight ? "light" : "dark");
      }
    </script>
  </body>
</html>
