<!doctype html>
<html lang="en">
  <head>

    />

    <style>
      /* ── PAGE WRAP ── */
      .cart-wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: calc(var(--nav-h) + 20px) clamp(14px, 3vw, 40px) 60px;
      }
      .cart-heading h1 {
        font-family: var(--font-d);
        font-size: clamp(24px, 3.5vw, 36px);
        line-height: 1.15;
        margin: 0;
        color: var(--cream);
      }
      .cart-heading h1 em {
        color: var(--gold);
        font-style: italic;
      }
      .cart-sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }

      /* ── TWO-COLUMN LAYOUT ── */
      .cart-layout {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 20px;
        align-items: start;
        margin-top: 18px;
      }
      .cart-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .cart-row {
        display: grid;
        grid-template-columns: 64px 1fr auto auto;
        gap: 14px;
        align-items: center;
        background: var(--ink-card);
        border: 1px solid var(--border-s);
        border-radius: var(--r-lg);
        padding: 10px 14px;
      }
      .cart-cover {
        width: 64px;
        height: 90px;
        border-radius: var(--r);
        object-fit: cover;
        background: var(--ink-mid);
        image-rendering: -webkit-optimize-contrast;
      }
      .cart-item-title {
        color: var(--cream);
        font-family: "DM Sans", sans-serif;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.35;
      }
      .cart-type-badge {
        display: inline-block;
        margin-left: 8px;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 9px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
        vertical-align: middle;
      }
      .cart-type-badge.digital {
        background: rgba(122, 167, 201, 0.15);
        color: #7aa7c9;
      }
      .cart-type-badge.print {
        background: rgba(212, 175, 55, 0.15);
        color: var(--gold);
      }
      .cart-item-meta {
        color: var(--muted);
        font-family: "DM Sans", sans-serif;
        font-size: 12px;
        margin-top: 4px;
        opacity: 0.9;
      }
      .cart-stepper {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border-s);
        border-radius: var(--r);
        background: var(--ink-mid);
      }
      .cart-stepper button {
        width: 26px;
        height: 26px;
        border: 0;
        background: transparent;
        color: var(--gold);
        cursor: pointer;
        font-size: 15px;
      }
      .cart-stepper span {
        min-width: 24px;
        text-align: center;
        color: var(--cream);
        font-size: 12px;
        font-weight: 700;
      }
      .cart-price {
        color: var(--gold);
        font-family: "DM Sans", sans-serif;
        font-size: 15px;
        font-weight: 700;
        white-space: nowrap;
      }
      .cart-remove {
        border: 1px solid rgba(196, 100, 122, 0.45);
        background: rgba(196, 100, 122, 0.08);
        color: var(--ch-rose-deep, #c4647a);
        border-radius: var(--r);
        padding: 5px 9px;
        font-size: 9px;
        text-transform: uppercase;
        cursor: pointer;
        margin-left: 8px;
      }

      /* ── SUMMARY (right column) ── */
      .cart-summary {
        position: sticky;
        top: calc(var(--nav-h) + 16px);
        background: var(--ink-mid);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 16px 18px;
      }
      .cart-summary-title {
        font-family: var(--font-b);
        font-size: 10px;
        color: var(--gold);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .cart-summary-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        color: var(--muted);
        font-size: 13px;
        border-bottom: 1px solid var(--border-s);
      }
      .cart-summary-total {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 12px;
        color: var(--cream);
        font-size: 13px;
      }
      .cart-summary-total span:last-child {
        font-family: var(--font-d);
        color: var(--gold);
        font-size: 26px;
      }
      .btn-checkout {
        width: 100%;
        margin-top: 12px;
        padding: 12px;
        border: none;
        border-radius: var(--r);
        background: linear-gradient(135deg, var(--gold), var(--gold-lt));
        color: var(--ink);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
      }
      .empty-cart {
        text-align: center;
        padding: 36px 20px;
        color: var(--muted);
      }
      .empty-cart a {
        color: var(--gold);
      }

      /* ── YOU MAY ALSO LIKE ── */
      .upsell-section {
        margin-top: 28px;
      }
      .upsell-label {
        font-family: var(--font-b);
        font-size: 10px;
        color: var(--gold);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 12px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .upsell-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border-s);
      }
      .upsell-grid {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 12px;
      }
      .upsell-card {
        background: var(--ink-card);
        border: 1px solid var(--border-s);
        border-radius: var(--r);
        padding: 8px;
        text-align: center;
        display: flex;
        flex-direction: column;
      }
      .upsell-card a {
        display: block;
      }
      .upsell-card img {
        display: block;
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        border-radius: var(--r);
        margin-bottom: 8px;
      }
      .upsell-card .upsell-title {
        color: var(--cream);
        font-size: 12px;
        font-weight: 600;
        line-height: 1.3;
        min-height: 32px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .upsell-card .upsell-price {
        color: var(--gold);
        font-size: 12px;
        margin: 6px 0 8px;
      }
      .upsell-card .upsell-add-btn {
        display: block;
        width: 100%;
        margin-top: auto;
        padding: 7px;
        border: none;
        border-radius: var(--r);
        background: var(--gold);
        color: var(--ink);
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        cursor: pointer;
        font-family: "DM Sans", sans-serif;
        transition: background 0.2s;
      }
      .upsell-card .upsell-add-btn:hover {
        background: var(--gold-lt, #e0c368);
      }

      /* ── RESPONSIVE ── */
      @media (max-width: 900px) {
        .cart-layout {
          grid-template-columns: 1fr;
        }
        .cart-summary {
          position: static;
        }
        .upsell-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (max-width: 560px) {
        .cart-row {
          grid-template-columns: 64px 1fr;
        }
        .cart-row > :nth-child(3),
        .cart-row > :nth-child(4) {
          grid-column: 2;
        }
        .upsell-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>

    <script>
      window.CH_API_URL = [
        "thecrossedhearts.com",
        "www.thecrossedhearts.com",
      ].includes(window.location.hostname)
        ? "https://crossed-hearts-final.onrender.com/api"
        : window.location.hostname === "crossed-hearts.onrender.com"
          ? "https://crossed-hearts-final.onrender.com/api"
          : ["localhost", "127.0.0.1", ""].includes(window.location.hostname) ||
              window.location.protocol === "file:"
            ? "http://localhost:5000/api"
            : "https://crossed-hearts-final.onrender.com/api";
    </script>
    <script src="script.js"></script>
    <script>
      (function () {
        if (localStorage.getItem("ch-theme") === "light")
          document.body.classList.add("light-mode");
      })();
      function toggleTheme() {
        const l = document.body.classList.toggle("light-mode");
        localStorage.setItem("ch-theme", l ? "light" : "dark");
      }
      renderAuthForm("in");

      // How many "You May Also Like" cards to show (6 fills the grid evenly
      // at 6, 3 and 2 columns)
      const UPSELL_COUNT = 6;

      function renderCartPage() {
        const cart = chGetCart();
        const listEl = document.getElementById("cartList");

        if (!cart.length) {
          listEl.innerHTML = `<div class="empty-cart">Your cart is empty. <a href="index.html#allSeries">Browse titles →</a></div>`;
          renderCartUpsell();
          return;
        }

        const rows = cart
          .map(
            (c) => `
              <div class="cart-row">
                ${c.cover ? `<img class="cart-cover" src="${c.cover}" alt="">` : `<div class="cart-cover"></div>`}
                <div>
                  <div class="cart-item-title"><a href="${c.url || c.href || "#"}" style="color:inherit;text-decoration:none;">${c.title}</a><span class="cart-type-badge ${c.type}">${c.type === "digital" ? "Digital" : "Paperback"}</span></div>
                  <div class="cart-item-meta">${c.type === "print" ? (c.edition || "Standard") + (c.isPreorder ? " · Preorder" : "") : "Digital Copies"}</div>
                </div>
                ${
                  c.type === "print"
                    ? `<div class="cart-stepper">
                       <button onclick="chUpdateCartQty('${c.id}', -1); renderCartPage();">−</button>
                       <span>${c.quantity}</span>
                       <button onclick="chUpdateCartQty('${c.id}', 1); renderCartPage();">+</button>
                     </div>`
                    : `<div></div>`
                }
                <div>
                  <span class="cart-price">$${(c.price * c.quantity).toFixed(2)}</span>
                  <button class="cart-remove" onclick="chRemoveCartItem('${c.id}'); renderCartPage();">Remove</button>
                </div>
              </div>
            `,
          )
          .join("");

        const subtotal = chCartSubtotal();
        listEl.innerHTML = `
              <div class="cart-layout">
                <div class="cart-list">${rows}</div>
                <aside class="cart-summary">
                  <div class="cart-summary-title">Order Summary</div>
                  <div class="cart-summary-row"><span>Digital items</span><span>${cart.filter((c) => c.type === "digital").length}</span></div>
                  <div class="cart-summary-row"><span>Print items</span><span>${cart.filter((c) => c.type === "print").reduce((n, c) => n + c.quantity, 0)}</span></div>
                  ${cart.some((c) => c.type === "print") ? `<div class="cart-summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>` : ""}
                  <div class="cart-summary-total"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
                  <button class="btn-checkout" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
                </aside>
              </div>
            `;
        renderCartUpsell();
      }

      // ── UPSELL POOL — built from catalog.js (window.CH_CATALOG) ──
      // Digital prices come from cart-pricing.js (CH_PRICING).
      // Print prices come from catalog.js.

      function escHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function slugify(s) {
        return String(s || "")
          .toLowerCase()
          .replace(/[’']/g, "")
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "");
      }

      // "From $0.75" -> 0.75, "$25" -> 25, "From $9" -> 9
      function parseCatalogPrice(str) {
        const m = String(str || "").match(/(\d+(?:\.\d+)?)/);
        return m ? parseFloat(m[1]) : 0;
      }

      // Lowercase title with any "(Print)" suffix removed, for duplicate checks
      function normTitle(t) {
        return String(t || "")
          .replace(/\s*\(print\)\s*$/i, "")
          .trim()
          .toLowerCase();
      }

      function isPrintEntry(item) {
        return (
          item.category === "Print" ||
          item.printOnly === true ||
          String(item.url || "").startsWith("print-")
        );
      }

      function buildUpsellPool() {
        const catalog = Array.isArray(window.CH_CATALOG)
          ? window.CH_CATALOG
          : [];
        const pool = [];
        const seen = new Set();
        const fmt = (n) => "$" + (Number.isInteger(n) ? n : n.toFixed(2));

        catalog.forEach((item) => {
          if (!item || !item.title) return;
          const type = isPrintEntry(item) ? "print" : "digital";

          let priceValue, priceText;
          if (type === "print") {
            priceValue = parseCatalogPrice(item.price);
            priceText = item.price;
          } else {
            const p = chDigitalPricing(item);
            priceValue = p.full;
            priceText = p.chapter
              ? "Ch. from " + fmt(p.chapter) + " · Full " + fmt(p.full)
              : "Full volume " + fmt(p.full);
          }
          if (!priceValue) return;

          let title = item.title;
          if (type === "print" && !/\(print\)\s*$/i.test(title)) {
            title += " (Print)";
          }

          const id =
            (type === "print" ? "print-" : "") + slugify(normTitle(title));
          const key = type + "|" + id;
          if (seen.has(key)) return;
          seen.add(key);

          pool.push({
            id,
            type,
            title,
            cover: item.cover,
            price: priceText,
            priceValue,
            link: item.url,
          });
        });

        return pool;
      }

      const CH_UPSELL_POOL = buildUpsellPool();

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      let currentUpsellPicks = [];

      function renderCartUpsell() {
        const section = document.getElementById("cartUpsellSection");
        const box = document.getElementById("cartUpsell");
        const cart = chGetCart();

        const inCart = new Set(
          cart.map((c) => c.type + "|" + normTitle(c.title)),
        );
        const cartIds = new Set(cart.map((c) => c.type + "|" + c.id));

        const available = CH_UPSELL_POOL.filter(
          (b) =>
            !inCart.has(b.type + "|" + normTitle(b.title)) &&
            !cartIds.has(b.type + "|" + b.id),
        );

        currentUpsellPicks = shuffle(available).slice(0, UPSELL_COUNT);

        if (!currentUpsellPicks.length) {
          section.style.display = "none";
          box.innerHTML = "";
          return;
        }
        section.style.display = "";

        box.innerHTML = currentUpsellPicks
          .map(
            (b, i) => `
    <div class="upsell-card">
      <a href="${escHtml(b.link)}"><img src="${escHtml(b.cover)}" alt="${escHtml(b.title)}"></a>
      <div class="upsell-title" title="${escHtml(b.title)}">${escHtml(b.title)}</div>
      <div class="upsell-price">${escHtml(b.price)}</div>
      <button type="button" class="upsell-add-btn" onclick="${b.type === "digital" ? `window.location.href='${escHtml(b.link)}'` : `addUpsellToCart(${i})`}">${b.type === "digital" ? "View &amp; Choose" : "Add to Cart"}</button>
    </div>
  `,
          )
          .join("");
      }

      function addUpsellToCart(index) {
        const item = currentUpsellPicks[index];
        if (!item) return;

        const cart = chGetCart();
        const existing = cart.find(
          (c) => c.id === item.id && c.type === item.type,
        );

        if (existing) {
          if (item.type === "print") {
            existing.quantity = Number(existing.quantity || 1) + 1;
          } else {
            showToast("Already in your cart.", "info");
            renderCartPage();
            return;
          }
        } else {
          cart.push({
            id: item.id,
            type: item.type,
            title: item.title,
            cover: item.cover,
            price: item.priceValue,
            quantity: 1,
            url: item.link,
            edition: item.type === "print" ? "Standard" : undefined,
          });
        }

        chSaveCart(cart);
        showToast("Added to cart!", "success");
        renderCartPage();
      }

      // Correct saved digital prices (see cart-pricing.js), then draw the page
      chFixCartPrices();
      renderCartPage();
    </script>
  </body>
