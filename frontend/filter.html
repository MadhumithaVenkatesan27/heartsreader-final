    <style>
      /* ── Filter Page Overlay ── */
      .filter-overlay {
        position: fixed;
        inset: 0;
        z-index: 1100;
        background: rgba(8, 5, 8, 0.82);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 90px;
        padding-bottom: 40px;
        overflow-y: auto;
      }

      .filter-modal {
        position: relative;
        width: 100%;
        max-width: 680px;
        margin: 0 24px;
      }

      /* Close button — same as nav-search-close */
      .filter-close {
        position: absolute;
        top: -44px;
        right: 0;
        background: none;
        border: none;
        color: var(--muted);
        font-size: 20px;
        cursor: pointer;
        line-height: 1;
        transition: color 0.2s;
      }
      .filter-close:hover {
        color: var(--cream);
      }

      /* Heading */
      .filter-heading {
        font-family: var(--font-b);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 14px;
      }

      /* Genre pill bar — mirrors the search bar inner box */
      .filter-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        background: var(--ink-card);
        border: 1.5px solid var(--gold);
        border-radius: 50px;
        padding: 10px 20px;
        gap: 8px;
        box-shadow:
          0 0 0 4px var(--gold-dim),
          0 8px 40px rgba(0, 0, 0, 0.6);
        margin-bottom: 12px;
      }

      .filter-bar-label {
        font-family: var(--font-b);
        font-size: 12px;
        color: var(--muted);
        flex-shrink: 0;
        margin-right: 4px;
      }

      .fg-pill {
        display: inline-flex;
        align-items: center;
        padding: 5px 13px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        font-family: var(--font-b);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.18s;
        white-space: nowrap;
      }
      .fg-pill:hover {
        border-color: var(--gold);
        color: var(--gold);
        background: var(--gold-dim);
      }
      .fg-pill.active {
        background: var(--gold);
        border-color: var(--gold);
        color: var(--ink);
        font-weight: 600;
      }

      /* Results list — mirrors .nav-search-suggestions */
      .filter-results {
        background: var(--ink-card);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
        margin-top: 8px;
      }

      .filter-results-header {
        padding: 12px 16px 8px;
        border-bottom: 1px solid var(--border-s);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .filter-results-label {
        font-family: var(--font-b);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .filter-results-count {
        font-family: var(--font-b);
        font-size: 11px;
        color: var(--muted);
      }

      /* Each result row — identical to .nav-suggestion-item */
      .filter-result-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 16px;
        border-bottom: 1px solid var(--border-s);
        text-decoration: none;
        color: inherit;
        transition: background 0.15s;
      }
      .filter-result-item:last-child {
        border-bottom: none;
      }
      .filter-result-item:hover {
        background: var(--gold-dim);
      }

      .filter-result-thumb {
        width: 44px;
        height: 58px;
        border-radius: 3px;
        background: var(--ink-mid);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
        font-size: 20px;
      }
      .filter-result-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .filter-result-text {
        flex: 1;
        min-width: 0;
      }
      .filter-result-title {
        font-family: var(--font-b);
        font-size: 13px;
        font-weight: 500;
        color: var(--cream);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 3px;
      }
      .filter-result-genre {
        font-family: var(--font-b);
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .filter-result-cat {
        font-family: var(--font-b);
        font-size: 11px;
        color: var(--lavender);
      }
      .filter-result-price {
        font-family: var(--font-b);
        font-size: 12px;
        color: var(--gold);
        flex-shrink: 0;
      }

      /* Empty / prompt states */
      .filter-empty {
        padding: 32px 16px;
        text-align: center;
        font-family: var(--font-b);
        font-size: 13px;
        color: var(--muted);
      }
      .filter-empty-icon {
        font-size: 28px;
        margin-bottom: 8px;
      }

    <script>
      renderAuthForm("in");

      (function () {
        if (localStorage.getItem("ch-theme") === "light")
          document.body.classList.add("light-mode");
      })();
      function toggleTheme() {
        var isLight = document.body.classList.toggle("light-mode");
        localStorage.setItem("ch-theme", isLight ? "light" : "dark");
      }

      function closeFilterIfBg(e) {
        if (e.target === e.currentTarget) history.back();
      }

      function filterBy(btn, genre) {
        document.querySelectorAll(".fg-pill").forEach(function (p) {
          p.classList.remove("active");
        });
        btn.classList.add("active");
        var url = new URL(window.location);
        if (genre === "All") url.searchParams.delete("genre");
        else url.searchParams.set("genre", genre);
        history.replaceState(null, "", url);

        var box = document.getElementById("filterResults");
        var catalog = window.CH_CATALOG || [];
        var matches =
          genre === "All"
            ? catalog
            : catalog.filter(function (item) {
                return item.genre.toLowerCase().includes(genre.toLowerCase());
              });

        if (!matches.length) {
          box.innerHTML =
            '<div class="filter-empty">' +
            '<div class="filter-empty-icon">📚</div>' +
            "No titles found for <strong>" +
            genre +
            "</strong>" +
            "</div>";
          return;
        }

        var label = genre === "All" ? "All Titles" : genre;
        box.innerHTML =
          '<div class="filter-results-header">' +
          '<span class="filter-results-label">' +
          label +
          "</span>" +
          '<span class="filter-results-count">' +
          matches.length +
          " title" +
          (matches.length !== 1 ? "s" : "") +
          "</span>" +
          "</div>" +
          matches
            .map(function (item) {
              return (
                '<a href="' +
                item.url +
                '" class="filter-result-item">' +
                '<div class="filter-result-thumb">' +
                (item.cover
                  ? '<img src="' + item.cover + '" alt="" />'
                  : "📖") +
                "</div>" +
                '<div class="filter-result-text">' +
                '<div class="filter-result-title">' +
                item.title +
                "</div>" +
                '<div class="filter-result-genre">' +
                item.genre +
                "</div>" +
                '<div class="filter-result-cat">' +
                item.category +
                "</div>" +
                "</div>" +
                '<div class="filter-result-price">' +
                item.price +
                "</div>" +
                "</a>"
              );
            })
            .join("");
      }

      function filterByCategory(btn, category) {
        document.querySelectorAll(".fg-pill").forEach(function (p) {
          p.classList.remove("active");
        });
        btn.classList.add("active");
        var url = new URL(window.location);
        url.searchParams.delete("genre");
        url.searchParams.set("category", category);
        history.replaceState(null, "", url);

        var box = document.getElementById("filterResults");
        var catalog = window.CH_CATALOG || [];
        var matches = catalog.filter(function (item) {
          return item.category === category;
        });

        if (!matches.length) {
          box.innerHTML =
            '<div class="filter-empty">' +
            '<div class="filter-empty-icon">📚</div>' +
            "No titles found in <strong>" +
            category +
            "</strong>" +
            "</div>";
          return;
        }

        var categoryLabels = {
          Print: "Print Editions",
        };
        box.innerHTML =
          '<div class="filter-results-header">' +
          '<span class="filter-results-label">' +
          (categoryLabels[category] || category) +
          "</span>" +
          '<span class="filter-results-count">' +
          matches.length +
          " title" +
          (matches.length !== 1 ? "s" : "") +
          "</span>" +
          "</div>" +
          matches
            .map(function (item) {
              return (
                '<a href="' +
                item.url +
                '" class="filter-result-item">' +
                '<div class="filter-result-thumb">' +
                (item.cover
                  ? '<img src="' + item.cover + '" alt="" />'
                  : "📖") +
                "</div>" +
                '<div class="filter-result-text">' +
                '<div class="filter-result-title">' +
                item.title +
                "</div>" +
                '<div class="filter-result-genre">' +
                item.genre +
                "</div>" +
                '<div class="filter-result-cat">' +
                item.category +
                "</div>" +
                "</div>" +
                '<div class="filter-result-price">' +
                item.price +
                "</div>" +
                "</a>"
              );
            })
            .join("");
      }

      // Auto-run on load
      (function () {
        var params = new URLSearchParams(window.location.search);
        var cat = params.get("category");
        if (cat) {
          var pill = Array.from(document.querySelectorAll(".fg-pill")).find(
            function (p) {
              return (
                p.dataset.category &&
                p.dataset.category.toLowerCase() === cat.toLowerCase()
              );
            },
          );
          if (pill) {
            filterByCategory(pill, pill.dataset.category);
            return;
          }
        }
        var g = params.get("genre");
        if (g) {
          var pill2 = Array.from(document.querySelectorAll(".fg-pill")).find(
            function (p) {
              return (
                p.dataset.genre &&
                p.dataset.genre.toLowerCase() === g.toLowerCase()
              );
            },
          );
          if (pill2) {
            filterBy(pill2, pill2.dataset.genre);
            return;
          }
        }
        filterBy(document.querySelector('.fg-pill[data-genre="All"]'), "All");
      })();
    </script>
  </body>
</html>
