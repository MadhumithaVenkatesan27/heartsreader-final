<!DOCTYPE html>
<html lang="en">
<head>
    <script src="clean-urls.js"></script>
  <meta name="google-site-verification" content="S9T4XiqDMXqg5zsTiZcJUyzM73NeDm0kfFlG9X9nqcA" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - Crossed Hearts</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050304;
      color: var(--paper, #f5ede8);
      padding: 24px;
    }
    .reset-panel {
      width: min(440px, 100%);
      border: 1px solid rgba(212, 175, 55, 0.25);
      background: rgba(18, 12, 18, 0.96);
      padding: 30px;
      border-radius: 8px;
    }
    .reset-logo {
      font-family: serif;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .reset-sub {
      color: var(--muted, #9f8fa8);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .reset-status {
      margin-top: 14px;
      min-height: 18px;
      font-size: 13px;
      color: var(--muted, #9f8fa8);
    }
    .reset-status.error { color: var(--rose, #e85d75); }
    .reset-status.success { color: #4caf76; }
  </style>
</head>
<body>
  <main class="reset-panel">
    <div class="reset-logo">Crossed Hearts</div>
    <p class="reset-sub">Enter a new password for your reader account.</p>

    <div class="form-group">
      <label class="form-label">New Password</label>
      <input type="password" class="form-input" id="newPassword" placeholder="Min. 8 characters" />
    </div>
    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <input type="password" class="form-input" id="confirmPassword" placeholder="Re-enter password" />
    </div>
    <button class="btn-pay" id="resetBtn" onclick="submitReset()">Reset Password</button>
    <div class="reset-status" id="resetStatus"></div>
  </main>

  <script>
    const CH_API_URL = (
      window.CH_API_URL ||
      (["localhost", "127.0.0.1", ""].includes(location.hostname) || location.protocol === "file:" ? localStorage.getItem("ch_api_url") : "") ||
      (["thecrossedhearts.com", "www.thecrossedhearts.com"].includes(location.hostname)
        ? "https://crossed-hearts-final.onrender.com/api"
        : location.hostname === "crossed-hearts.onrender.com"
          ? "https://crossed-hearts-final.onrender.com/api"
        :
      (["localhost", "127.0.0.1", ""].includes(location.hostname) || location.protocol === "file:"
        ? "http://localhost:5000/api"
        : "https://crossed-hearts-final.onrender.com/api"))
    ).replace(/\/$/, "");

    function setStatus(message, type) {
      const el = document.getElementById("resetStatus");
      el.textContent = message || "";
      el.className = "reset-status " + (type || "");
    }

    async function submitReset() {
      const token = new URLSearchParams(window.location.search).get("token");
      const password = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const btn = document.getElementById("resetBtn");

      if (!token) {
        setStatus("Reset token is missing. Please use the latest email link.", "error");
        return;
      }
      if (!password || password.length < 8) {
        setStatus("Password must be at least 8 characters.", "error");
        return;
      }
      if (password !== confirmPassword) {
        setStatus("Passwords do not match.", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Resetting...";
      setStatus("");

      try {
        const res = await fetch(`${CH_API_URL}/auth/reset-password?token=${encodeURIComponent(token)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (!res.ok || data.status !== "success") {
          setStatus(data.message || "Could not reset password.", "error");
          return;
        }
        sessionStorage.removeItem("ch_token");
        localStorage.removeItem("ch_user_persist");
        sessionStorage.removeItem("ch_user");
        setStatus("Password reset successfully. Redirecting to sign in...", "success");
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1400);
      } catch (err) {
        setStatus("Cannot connect to server. Please try again.", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Reset Password";
      }
    }
  </script>
</body>
</html>
