# Persistent MongoDB + a web UI to browse the data.
#
#   docker compose up -d                 -> MongoDB (port 27017) + Mongo Express UI (http://localhost:8081)
#   docker compose --profile app up -d   -> the above PLUS the API itself in a container (http://localhost:5000)
#   docker compose down                  -> stop (data is KEPT in the named volume)
#   docker compose down -v               -> stop AND DELETE all data (be careful)
#
# Everything is bound to 127.0.0.1 so it is only reachable from your own computer.
# Change the dev passwords below (or set them in a .env file next to this one) before using this anywhere real.

services:
  mongo:
    image: mongo:7
    container_name: ch-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-chadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-me-dev-password}
      MONGO_INITDB_DATABASE: crossed_hearts
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db          # <- this is where your data permanently lives
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Web UI to look at (and edit) users, books, purchases, notifications ... live.
  mongo-express:
    image: mongo-express:1.0.2
    container_name: ch-mongo-ui
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-chadmin}:${MONGO_ROOT_PASSWORD:-change-me-dev-password}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_UI_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_UI_PASSWORD:-change-me-ui-password}
    ports:
      - "127.0.0.1:8081:8081"

  # Optional: run the API in Docker too (docker compose --profile app up -d --build)
  api:
    profiles: ["app"]
    build: .
    container_name: ch-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: .env
    environment:
      # inside Docker the database host is the service name "mongo", not 127.0.0.1
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-chadmin}:${MONGO_ROOT_PASSWORD:-change-me-dev-password}@mongo:27017/crossed_hearts?authSource=admin
      PORT: "5000"
      UPLOADS_DIR: /app/uploads/private
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - chapter_files:/app/uploads/private   # chapter PDFs persist here

volumes:
  mongo_data:
  chapter_files:
